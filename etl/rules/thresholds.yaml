# Pipeline thresholds. VERSIONED DATA — never inline constants (CLAUDE.md).
# Contract: docs/plans/etl.md §3 RuleSet; consumers noted per key.
version: "thr-v3"
# capped_gap_span_s / bout segmentation cap, seconds (derivations.md §3/§4).
# Provisional: 30 min, pending review against real gap distribution (median
# ~6 min, p90 ~2.3 h).
gap_cap_s: 1800
# quick_restart_after_s window (derivations.md §3): "under 1h".
quick_restart_window_s: 3600
# ±chars around a signature match for facts/tool_events.matched_snippet
# (docs/architecture/etl.md stage 5).
matched_snippet_radius_chars: 300
# Incident detection: a day counts as a rate excursion when the signature's
# daily count exceeds baseline * multiplier (stage 4; provisional).
incident_excursion_multiplier: 4
# Fork gate (stage 1): two NON-DEMO sessions of the same auditor+client are a
# fork when they share >= 2 turn NUMBERS and every shared number occurs in both
# sessions within this many seconds (lockstep shadowing — a duplicated stream,
# not merely two concurrent tasks, which are real and expected in this data).
# Demo traffic is excluded: the demo user runs scripted same-timestamp session
# bursts that lockstep by construction (derivations.md §3 is_demo_traffic —
# "excludable everywhere"). Fires zero times on the real dataset, as required.
fork_lockstep_threshold_s: 600
# UI stated-params (contracts StatedParamsSchema requires these in the
# published manifest — cross-track seam review 2026-08-22).
# Heatmap dotted-cell cutoff: cells computed from fewer calls than this render
# as small-n. Provisional.
small_n_call_threshold: 5
# /product/agent grind table cutoff: a same-tool run at or above this length
# is listed. Provisional (max_same_tool_run p99 territory).
grind_run_threshold: 20
# Enrichment-runner transport parameters (stage 3). max_transport_attempts is
# the per-record call bound (HTTP 429/5xx retried with exponential backoff,
# timeouts retried without sleeping) before the record degrades to an error
# row; chosen so a burst of endpoint failures costs one record, not the job.
enrichment:
  max_transport_attempts: 6
  backoff_base_ms: 250
  # In-flight LLM calls (p-limit). Records within a job are independent
  # (docs/architecture/llm.md "concurrency N with retry"); DB writes stay
  # sequential in batch order regardless (single DuckDB connection + the
  # deterministic resume contract). Tests pin this to 1 via the harness —
  # the scripted client's shared per-call cursor requires a deterministic
  # consumption order.
  concurrency: 8
# J5 heuristic-audit sampling (docs/architecture/llm.md J5) — seeded so
# re-runs are comparable.
j5:
  unmatched_sample_n: 150
  matched_sample_m: 100
  seed: 20260401
# Structural-marker templates on user messages (derivations.md §2). Verbatim
# template strings verified against data/traces.jsonl: 113 task-notification,
# 115 skill-body, 98 extract-paste hits — matching derivations.md exactly.
markers:
  task_notification: "<task-notification>"
  skill_body: "Base directory for this skill:"
  extract_paste: "Here's the extract I'm working from:"
# short_typed_after_short_gap candidate generator (derivations.md §2 reported
# ~92 candidates from the original analysis; these values yield 94 on the full
# dataset — the closest round-number calibration; the original analysis's
# exact thresholds were not recorded). Provisional.
correction_candidate:
  max_typed_chars: 80
  max_gap_s: 120
